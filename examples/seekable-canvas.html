<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#080b12;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="scene"></canvas><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let seconds=0,playing=true,last=performance.now();
function draw(t){
 canvas.width=innerWidth;canvas.height=innerHeight;
 const w=canvas.width,h=canvas.height;
 ctx.fillStyle='#080b12';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#65e2bf';ctx.beginPath();ctx.arc(w*(.2+.6*Math.min(t/3,1)),h*.5,h*.1,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f0f6ff';ctx.font=`bold ${h*.06}px Arial`;ctx.textAlign='center';ctx.fillText('Seekable canvas · '+t.toFixed(2)+' sec',w/2,h*.75);
}
window.motionforgeSeek=t=>{seconds=t;draw(t);};
window.motionforgeSetPlaying=value=>{playing=value;last=performance.now();};
function tick(now){if(playing){seconds=Math.min(3,seconds+(now-last)/1000);draw(seconds);}last=now;requestAnimationFrame(tick);}
draw(0);requestAnimationFrame(tick);
</script></body></html>
