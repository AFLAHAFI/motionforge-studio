<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#edf1f5;font-family:Arial,sans-serif;color:#1c2b3f}.page{padding:7vw;width:100%;height:100%}small{letter-spacing:.3em;color:#546b83;font-size:1.4vw}h1{font-size:4.5vw;margin:2vw 0 4vw}.cards{display:flex;gap:2vw}.card{flex:1;background:white;border-radius:1.5vw;padding:2.5vw;box-shadow:0 1vw 3vw #22334412;animation:enter 1.2s both}.card:nth-child(2){animation-delay:.3s}.card:nth-child(3){animation-delay:.6s}h2{font-size:1.5vw;color:#546b83;font-weight:400}.value{font-size:4vw;font-weight:700}.track{background:#e3eaf0;height:1vw;border-radius:1vw;margin-top:3vw;overflow:hidden}.fill{width:80%;height:100%;background:#237f88;transform-origin:left;animation:grow 2.5s .6s both}.card:nth-child(2) .fill{width:64%;background:#7566a2}.card:nth-child(3) .fill{width:92%;background:#c08b3b}@keyframes enter{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style></head><body><main class="page"><small>ANIMATED DASHBOARD</small><h1>A clear view of progress.</h1><div class="cards"><section class="card"><h2>Projects completed</h2><div class="value">80%</div><div class="track"><div class="fill"></div></div></section><section class="card"><h2>Monthly target</h2><div class="value">64%</div><div class="track"><div class="fill"></div></div></section><section class="card"><h2>Customer satisfaction</h2><div class="value">92%</div><div class="track"><div class="fill"></div></div></section></div></main></body></html>
